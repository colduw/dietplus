plugins {
    id 'net.neoforged.moddev'
    id 'idea'
    id 'me.modmuss50.mod-publish-plugin'
}

version = "${version}"
group = "top.theillusivec4.${mod_id}"

base {
    archivesName = "${mod_id}-neoforge"
}

neoForge {
    version = neoforge_version

    runs {
        client { client()}
        server { server() }
        data {
            serverData()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // source project(":common").sourceSets.main
        }
    }
}

dependencies {
    compileOnly project(":common")

    implementation "curse.maven:curios-309927:${curios_version}"

    implementation(group: 'com.illusivesoulworks.spectrelib', name: 'spectrelib-neoforge', version: "${spectrelib_version}")
    jarJar(implementation(group: 'com.illusivesoulworks.spectrelib', name: 'spectrelib-neoforge')) {
        version {
            strictly "${spectrelib_range}"
            prefer "${spectrelib_version}"
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    source(project(":common").sourceSets.main.allSource)
}

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets {
    main {
        resources {
            srcDirs += '../licenses'
        }
    }
}

def resourceTargets = ['META-INF/neoforge.mods.toml', 'pack.mcmeta', '*.mixins.json']
def replaceProperties = [
        neoforge_version: forge_version, neoforge_version_range: neoforge_version_range, version: version,
        neoforge_mc_version_range: neoforge_mc_version_range, license: license, mod_id: mod_id, mod_author: mod_author,
        mod_description: mod_description, mod_name: mod_name, issue_tracker: issue_tracker, refmap_target: "${mod_id}.",
        updateURL: updateURL
]
processResources {
    from project(":common").sourceSets.main.resources
    duplicatesStrategy(DuplicatesStrategy.FAIL)
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    archiveClassifier.set("")
    from(rootProject.file("LICENSE"))
    from(rootProject.file("COPYING"))
    from(rootProject.file("COPYING.LESSER"))
    from(rootProject.file("README.md"))
    from(rootProject.file("CHANGELOG.md"))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishMods {
    file = jar.archiveFile
    displayName = "${jar.archiveFileName.get()}"
    changelog = rootProject.file('CHANGELOG_LATEST.md').text
    type = STABLE
    modLoaders.add("neoforge")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "${curseforge_id}"
        minecraftVersionList("${curseforge_version_list}")
        javaVersions.add(JavaVersion.VERSION_21)
        client = true
        server = true
    }
}